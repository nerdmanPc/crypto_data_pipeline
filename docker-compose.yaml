services:
  app:
    build:
      context: .
      target: runner
    ports:
      - "4369:4369"  # Porta do EPMD
      - "9001:9001"  # Porta de Distribuição que fixamos
    environment:
      SYMBOL_PAIRS: ${SYMBOL_PAIRS}
      KRAKEN_API_KEY: ${KRAKEN_API_KEY}
      KRAKEN_API_SECRET: ${KRAKEN_API_SECRET}
      POSTGRES_HOST: timescaledb
      POSTGRES_USER: crypto_data_pipeline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: crypto_data_repository
      RELEASE_COOKIE: ${RELEASE_COOKIE}
      RELEASE_DISTRIBUTION: name
      RELEASE_NODE: app@127.0.0.1
      ELIXIR_ERL_OPTIONS: "-kernel inet_dist_listen_min 9001 inet_dist_listen_max 9001"
    depends_on:
      - timescaledb
    restart: on-failure

  # helper service to run mix tasks (uses official Elixir image and mounts the project)
  mix:
    build:
      context: .
      target: builder
    environment:
      POSTGRES_HOST: timescaledb
      POSTGRES_USER: crypto_data_pipeline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: crypto_data_repository
      RELEASE_COOKIE: ${RELEASE_COOKIE}
    depends_on:
      - timescaledb

  timescaledb:
    #stdin_open: true
    #tty: true
    image: timescale/timescaledb:latest-pg18
    container_name: timescaledb
    environment:
      POSTGRES_DB: crypto_data_repository
      POSTGRES_USER: crypto_data_pipeline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - timescale-data:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crypto_data_pipeline -d crypto_data_repository"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  timescale-data:
    driver: local
