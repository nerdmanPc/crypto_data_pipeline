services:
  app:
    build:
      context: .
      target: runner
    environment:
      TRADE_SYMBOL_PAIRS: ${TRADE_SYMBOL_PAIRS}
      ORDER_SYMBOL_PAIRS: ${ORDER_SYMBOL_PAIRS}
      KRAKEN_API_KEY: ${KRAKEN_API_KEY}
      KRAKEN_API_SECRET: ${KRAKEN_API_SECRET}
      # Postgres/TimescaleDB connection (used by Ecto)
      #DATABASE_URL: "postgres://crypto_data_pipeline:${PGPASSWORD}@timescaledb:5432/crypto_data_repository"
      POSTGRES_HOST: timescaledb
      POSTGRES_USER: crypto_data_pipeline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: crypto_data_repository
    depends_on:
      - timescaledb
    restart: on-failure

  # helper service to run mix tasks (uses official Elixir image and mounts the project)
  mix:
    build:
      context: .
      target: builder
    environment:
      POSTGRES_HOST: timescaledb
      POSTGRES_USER: crypto_data_pipeline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: crypto_data_repository
    depends_on:
      - timescaledb

  timescaledb:
    #stdin_open: true
    #tty: true
    image: timescale/timescaledb:latest-pg18
    container_name: timescaledb
    environment:
      POSTGRES_DB: crypto_data_repository
      POSTGRES_USER: crypto_data_pipeline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crypto_data_pipeline -d crypto_data_repository"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  timescale_data:
    driver: local
