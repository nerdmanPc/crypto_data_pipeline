services:
  app:
    image: crypto_data_pipeline
    environment:
      KRAKEN_API_KEY: ${KRAKEN_API_KEY}
      KRAKEN_API_SECRET: ${KRAKEN_API_SECRET}
      # Postgres/TimescaleDB connection (used by Ecto)
      #DATABASE_URL: "postgres://crypto_data_pipeline:${PGPASSWORD}@timescaledb:5432/crypto_data_repository"
      POSTGRES_HOST: timescaledb
      POSTGRES_USER: crypto_data_pipeline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: crypto_data_repository
    depends_on:
      - timescaledb

  timescaledb:
    image: timescale/timescaledb:latest-pg14
    environment:
      POSTGRES_USER: crypto_data_pipeline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: crypto_data_repository
    ports:
      - "5432:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data
    restart: unless-stopped

  # helper service to run mix tasks (uses official Elixir image and mounts the project)
  mix:
    image: elixir:1.20-alpine
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      POSTGRES_HOST: timescaledb
      POSTGRES_USER: crypto_data_pipeline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: crypto_data_repository
    depends_on:
      - timescaledb

volumes:
  timescale-data:
    driver: local